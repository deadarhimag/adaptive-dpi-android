name: Pixel 7

# Ручной запуск с main. Требуется внешнее ограничение доступа к раннеру и явное включение владельцем.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Сценарий
        type: choice
        required: true
        default: transport
        options:
          - transport
          - wifi-cycle
          - capabilities
      transport_target:
        description: Частный IPv4 компьютера для сценария transport, например 192.168.0.157
        required: false
        type: string
      serial:
        description: Serial телефона из adb devices, если подключено несколько устройств
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pixel7
  cancel-in-progress: false

jobs:
  pixel7:
    if: github.repository == 'deadarhimag/adaptive-dpi-android' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.PIXEL7_RUNNER_ISOLATED == 'true'
    runs-on: [self-hosted, pixel7]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - name: Получить исходники
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Подготовить отдельные пути запуска
        run: |
          $root = Join-Path $env:RUNNER_TEMP "pixel7-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          "STATE_FILE=$(Join-Path $root 'state.json')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOG_DIRECTORY=$(Join-Path $root 'logs')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARTIFACT_DIRECTORY=$(Join-Path $root 'artifact')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Найти успешную сборку этого коммита
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $uri = "$($env:GITHUB_API_URL)/repos/$($env:GITHUB_REPOSITORY)/actions/workflows/android-build.yml/runs?branch=$($env:GITHUB_REF_NAME)&status=success&per_page=30"
          $runs = Invoke-RestMethod -Uri $uri -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json' }
          # Нужна сборка ровно этого коммита из этого репозитория: скрипты и APK должны быть из одной версии.
          $run = $runs.workflow_runs | Where-Object { $_.head_sha -eq $env:GITHUB_SHA -and $_.event -in @('push', 'workflow_dispatch') -and $_.head_repository.full_name -eq $env:GITHUB_REPOSITORY } | Select-Object -First 1
          if (-not $run) { throw "Для коммита $($env:GITHUB_SHA) нет успешной «Сборки Android» в ветке $($env:GITHUB_REF_NAME). Дождитесь её и повторите." }
          "run_id=$($run.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $version = "$($run.run_number).$($run.run_attempt)"
          "build=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact=adaptive-dpi-android-debug-$($env:GITHUB_SHA.Substring(0,12))-$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Скачать APK проверенной сборки
        uses: actions/download-artifact@v5
        with:
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
          name: ${{ steps.build.outputs.artifact }}
          path: ${{ env.ARTIFACT_DIRECTORY }}

      - name: Проверить SHA и контрольные суммы артефакта
        env:
          EXPECTED_CERT: ${{ vars.ANDROID_CI_DEBUG_CERT_SHA256 }}
          EXPECTED_BUILD: ${{ steps.build.outputs.build }}
        run: |
          $info = Get-Content -LiteralPath (Join-Path $env:ARTIFACT_DIRECTORY 'build-info.json') -Raw | ConvertFrom-Json
          if ($info.commit -ne $env:GITHUB_SHA -or $info.build -ne $env:EXPECTED_BUILD -or -not $env:EXPECTED_CERT -or $info.certificateSha256 -ne $env:EXPECTED_CERT) {
            throw 'Артефакт не соответствует точному SHA или сертификату CI.'
          }
          foreach ($apk in @(
            @{ Name = 'app-debug.apk'; Sha = $info.app.sha256 },
            @{ Name = 'app-debug-androidTest.apk'; Sha = $info.test.sha256 }
          )) {
            if ((Get-FileHash -LiteralPath (Join-Path $env:ARTIFACT_DIRECTORY $apk.Name) -Algorithm SHA256).Hash -ne $apk.Sha) {
              throw "Контрольная сумма $($apk.Name) не совпала."
            }
          }

      - name: Снять состояние телефона и проверить условия
        env:
          INPUT_SERIAL: ${{ inputs.serial }}
        run: |
          New-Item -ItemType Directory -Path $env:LOG_DIRECTORY -Force | Out-Null
          $arguments = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', '.\scripts\pixel7-session.ps1', '-Action', 'Snapshot', '-StateFile', $env:STATE_FILE)
          if ($env:INPUT_SERIAL) { $arguments += @('-Serial', $env:INPUT_SERIAL) }
          powershell @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Сценарий transport
        if: inputs.scenario == 'transport'
        env:
          INPUT_TARGET: ${{ inputs.transport_target }}
        run: |
          if (-not $env:INPUT_TARGET) { throw 'Для сценария transport укажите transport_target.' }
          $arguments = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', '.\scripts\test-pixel7.ps1',
            '-TransportTarget', $env:INPUT_TARGET, '-ArtifactDirectory', $env:ARTIFACT_DIRECTORY, '-LogDirectory', (Join-Path $env:LOG_DIRECTORY 'transport'))
          $selected = (Get-Content -LiteralPath $env:STATE_FILE -Raw | ConvertFrom-Json).serial
          $arguments += @('-Serial', $selected)
          powershell @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Сценарий wifi-cycle
        if: inputs.scenario == 'wifi-cycle'
        run: |
          $arguments = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', '.\scripts\pixel7-session.ps1', '-Action', 'WifiCycle', '-StateFile', $env:STATE_FILE)
          powershell @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Сценарий capabilities
        if: inputs.scenario == 'capabilities'
        run: |
          $arguments = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', '.\scripts\pixel7-session.ps1', '-Action', 'Capabilities', '-StateFile', $env:STATE_FILE,
            '-LogDirectory', (Join-Path $env:LOG_DIRECTORY 'capabilities'), '-ArtifactDirectory', $env:ARTIFACT_DIRECTORY)
          powershell @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Собрать журналы телефона
        if: always()
        run: |
          if ($env:STATE_FILE -and (Test-Path -LiteralPath $env:STATE_FILE)) {
            powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\pixel7-session.ps1 -Action Collect -StateFile $env:STATE_FILE -LogDirectory (Join-Path $env:LOG_DIRECTORY 'device')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Вернуть исходное состояние телефона
        if: always()
        run: |
          if ($env:STATE_FILE -and (Test-Path -LiteralPath $env:STATE_FILE)) {
            powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\pixel7-session.ps1 -Action Restore -StateFile $env:STATE_FILE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Сохранить журналы
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pixel7-logs-${{ github.run_number }}.${{ github.run_attempt }}
          path: ${{ env.LOG_DIRECTORY }}
          if-no-files-found: warn
