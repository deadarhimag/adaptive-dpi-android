name: Сборка Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - name: Получить исходники
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Настроить JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Подготовить Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0"

      - name: Подготовить Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Запустить модульные тесты
        run: ./gradlew testDebugUnitTest :engine:test

      - name: Собрать debug APK
        run: ./gradlew assembleDebug

      - name: Проверить Android-код и собрать инструментальные тесты
        run: ./gradlew :app:lintDebug :app:assembleDebugAndroidTest

      - name: Загрузить APK
        uses: actions/upload-artifact@v7
        with:
          name: adaptive-dpi-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
