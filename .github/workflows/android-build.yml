name: Сборка Android

# Правки только документации не пересобирают APK. docs/PIXEL7_TESTING_RU.md входит в артефакт
# сборки, поэтому его изменение сборку запускает. Порядок шаблонов важен: последний совпавший побеждает.
on:
  push:
    branches: [main]
    paths: ['**', '!**/*.md', '!docs/**', '!LICENSE', 'docs/PIXEL7_TESTING_RU.md']
  pull_request:
    paths: ['**', '!**/*.md', '!docs/**', '!LICENSE', 'docs/PIXEL7_TESTING_RU.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - name: Проверить источник pull request для подписанной сборки
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo '::error::Подписанный debug APK собирается только в доверенных ветках репозитория. В workflow из форка ключ подписи недоступен.'
          exit 1

      - name: Получить исходники
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Настроить JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Проверить параметры постоянной подписи debug APK
        env:
          ANDROID_CI_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_CI_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_CI_DEBUG_STORE_PASSWORD: ${{ secrets.ANDROID_CI_DEBUG_STORE_PASSWORD }}
          ANDROID_CI_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_CI_DEBUG_KEY_PASSWORD }}
          ANDROID_CI_DEBUG_CERT_SHA256: ${{ vars.ANDROID_CI_DEBUG_CERT_SHA256 }}
        run: bash .github/scripts/prepare-ci-debug-signing.sh

      - name: Подготовить Android SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Для AVD требуется свободное место. Проект использует NDK 28.2.
          installed=$("$sdkmanager" --list_installed)
          mapfile -t unused_ndk < <(awk '$1 ~ /^ndk;[0-9]+\.[0-9]+\.[0-9]+$/ {
            split($1, version, /[;.]/)
            if (version[2] >= 29) print $1
          }' <<< "$installed")
          if (( ${#unused_ndk[@]} > 0 )); then
            "$sdkmanager" --uninstall "${unused_ndk[@]}"
          fi
          df -h "$ANDROID_HOME"
          "$sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Подготовить зафиксированные исходники HEV
        run: python3 scripts/prepare-hev.py

      - name: Подготовить Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Запустить модульные тесты, lint и сборку APK
        env:
          ANDROID_CI_DEBUG_STORE_PASSWORD: ${{ secrets.ANDROID_CI_DEBUG_STORE_PASSWORD }}
          ANDROID_CI_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_CI_DEBUG_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --no-configuration-cache testDebugUnitTest :engine:test
          ./gradlew --no-daemon --no-configuration-cache :app:assembleDebug :app:lintDebug :app:lintRelease :app:assembleDebugAndroidTest :app:assembleRelease

      - name: Проверить влияние операций над своим сокетом на сегменты (Linux-хост, loopback)
        run: sudo python3 scripts/kernel-ops-pcap.py

      - name: Проверить системное согласие, жизненный цикл, Compose и транспорт через Android TUN
        id: device_tests
        timeout-minutes: 20
        env:
          ANDROID_CI_DEBUG_STORE_PASSWORD: ${{ secrets.ANDROID_CI_DEBUG_STORE_PASSWORD }}
          ANDROID_CI_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_CI_DEBUG_KEY_PASSWORD }}
        run: bash .github/scripts/test-diagnostics-on-emulator.sh

      - name: Сохранить диагностику сбоя Android-тестов
        if: always() && (steps.device_tests.outcome == 'failure' || steps.device_tests.outcome == 'cancelled')
        uses: actions/upload-artifact@v7
        with:
          name: tun-test-diagnostics-${{ github.run_number }}.${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tun-ci/
            app/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: warn

      - name: Сохранить результаты пройденных Android-тестов
        if: steps.device_tests.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: android-test-results-${{ github.run_number }}.${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tun-ci/results.json
            ${{ runner.temp }}/tun-ci/consent.log
            app/build/outputs/androidTest-results/connected/**/TEST-*.xml
          if-no-files-found: error

      - name: Проверить длительные TCP-соединения, конкуренцию Stop и ресурсы TUN
        id: extended_transport_tests
        timeout-minutes: 16
        run: bash .github/scripts/test-diagnostics-on-emulator.sh --extended

      - name: Сохранить отчёт расширенного тестирования транспорта
        if: always() && (steps.extended_transport_tests.outcome == 'success' || steps.extended_transport_tests.outcome == 'failure' || steps.extended_transport_tests.outcome == 'cancelled')
        uses: actions/upload-artifact@v7
        with:
          name: extended-transport-results-${{ github.run_number }}.${{ github.run_attempt }}
          path: ${{ runner.temp }}/tun-ci-extended/
          if-no-files-found: warn

      - name: Проверить содержимое APK и создать сведения о сборке
        id: apk
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -c core.fileMode=false status --porcelain)"
          build_number="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          artifact_name="adaptive-dpi-android-debug-${GITHUB_SHA:0:12}-$build_number"
          output_dir="$RUNNER_TEMP/adaptive-dpi-artifact"
          release_dir="$RUNNER_TEMP/adaptive-dpi-release-unsigned"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_TEST_RESULTS_JSON="$RUNNER_TEMP/tun-ci/results.json" \
            EXTENDED_ANDROID_TEST_RESULTS_JSON="$RUNNER_TEMP/tun-ci-extended/results.json" \
            bash .github/scripts/verify-debug-apk.sh \
            app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            "$tools" "$GITHUB_SHA" "$build_number" "$output_dir"
          python3 .github/scripts/verify-release-apk.py app/build/outputs/apk/release/app-release-unsigned.apk \
            "$tools/aapt2" "$tools/lib/apksigner.jar" "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            "$output_dir/build-info.json" "$release_dir"
          cp scripts/test-pixel7.ps1 scripts/transport-fixture.py scripts/apk-certificate.py \
            docs/PIXEL7_TESTING_RU.md "$output_dir/"
          echo "name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "directory=$output_dir" >> "$GITHUB_OUTPUT"
          echo "release_name=adaptive-dpi-android-release-unsigned-${GITHUB_SHA:0:12}-$build_number" >> "$GITHUB_OUTPUT"
          echo "release_directory=$release_dir" >> "$GITHUB_OUTPUT"
          cat "$output_dir/build-info.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Загрузить APK приложения, Android-тесты и скрипт для Pixel 7
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.directory }}
          if-no-files-found: error

      - name: Загрузить unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.release_name }}
          path: ${{ steps.apk.outputs.release_directory }}
          if-no-files-found: error

      - name: Удалить временный CI debug keystore
        if: always() && env.ANDROID_CI_DEBUG_KEYSTORE_PATH != ''
        run: |
          rm -f -- "$ANDROID_CI_DEBUG_KEYSTORE_PATH"
          rmdir -- "$(dirname "$ANDROID_CI_DEBUG_KEYSTORE_PATH")"
